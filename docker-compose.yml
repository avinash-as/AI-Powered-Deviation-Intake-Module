services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: deviation
      POSTGRES_PASSWORD: deviation
      POSTGRES_DB: deviations
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://deviation:deviation@db:5432/deviations
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      - db
volumes:
  pgdata:
